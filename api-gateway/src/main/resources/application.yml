server:
  port: 8082
  max-http-request-header-size: 32KB

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Chỉ giữ lại route cho backend services
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: stadium-service
          uri: lb://stadium-service
          predicates:
            - Path=/api/fields/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/