server:
  port: 8082
  max-http-request-header-size: 32KB

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:

        # User Service
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**

        # Stadium Service
        - id: stadium-service
          uri: lb://stadium-service
          predicates:
            - Path=/api/fields,/api/fields/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/