<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận lịch đặt</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#005a32] text-white min-h-screen flex flex-col justify-between font-sans selection:bg-emerald-200">

<div>
    <!-- ================= HEADER ================= -->
    <header class="bg-[#005a32] px-4 py-3.5 flex items-center justify-between border-b border-emerald-800">
        <button onclick="returnToBookingOrigin()" class="text-white hover:text-gray-200 text-lg px-1">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <h1 class="text-base md:text-lg font-bold uppercase tracking-wider text-center flex-1">
            ĐẶT LỊCH THEO SÂN - TRỰC QUAN
        </h1>
        <div class="w-6"></div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

        <!-- ================= BLOCK 1: THÔNG TIN SÂN ================= -->
        <section class="space-y-1.5">
            <div class="flex items-center space-x-2 text-yellow-400 font-bold text-sm md:text-base">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Thông tin sân</span>
            </div>
            <div class="text-xs md:text-sm space-y-1 text-gray-100 pl-6">
                <p>Tên CLB: <strong id="stadium-name" class="text-white">Đang tải...</strong></p>
                <p>Địa chỉ: <span id="stadium-address" class="text-gray-200">Đang tải...</span></p>
                <p>SĐT: <span id="stadium-phone" class="text-gray-200">0865658675</span></p>
            </div>
        </section>

        <!-- ================= BLOCK 2: THÔNG TIN LỊCH ĐẶT ================= -->
        <section class="space-y-1.5">
            <div class="flex items-center space-x-2 text-yellow-400 font-bold text-sm md:text-base">
                <i class="fa-solid fa-ticket"></i>
                <span>Thông tin lịch đặt</span>
            </div>
            <div class="text-xs md:text-sm space-y-1.5 text-gray-100 pl-6">
                <p>Ngày: <strong id="booking-date" class="text-white">--/--/----</strong></p>

                <!-- Danh sách sân và khung giờ -->
                <div id="court-summary-list" class="space-y-1 text-emerald-100 font-medium">
                    <!-- Đổ dữ liệu từ JS -->
                </div>

                <p>Đối tượng: <span id="sport-type-display" class="text-gray-200">Sân cầu lông</span></p>
                <p>Tổng giờ: <span id="total-hours" class="text-gray-200">0h00</span></p>
                <p>Tổng tiền: <strong id="total-price" class="text-white">0 đ</strong></p>
            </div>
        </section>

        <!-- ================= BLOCK 3: ƯU ĐÃI & THANH TOÁN ================= -->
        <section class="border-t border-b border-emerald-700/60 py-3 space-y-3">
            <div class="flex items-center justify-between text-xs md:text-sm">
                <span class="text-yellow-400 font-semibold">Ưu đãi</span>
                <button class="text-yellow-400 hover:underline font-medium flex items-center space-x-1">
                    <span>Chọn ưu đãi áp dụng</span>
                    <i class="fa-solid fa-circle-plus"></i>
                </button>
            </div>
            <div class="flex items-center justify-between text-xs md:text-sm font-bold">
                <span>Số tiền cần thanh toán</span>
                <span id="final-price" class="text-white text-sm md:text-base">0 đ</span>
            </div>
        </section>

        <!-- ================= BLOCK 4: FORM NHẬP THÔNG TIN ================= -->
        <section class="space-y-4 pt-2">
            <!-- TÊN CỦA BẠN (🔴 Đã xóa value cứng, yêu cầu tự nhập) -->
            <div class="space-y-1">
                <label class="block text-xs font-bold text-white uppercase tracking-wider">TÊN CỦA BẠN <span class="text-red-400">*</span></label>
                <div class="relative">
                    <input type="text" id="user-name" value=""
                           class="w-full bg-white text-gray-900 rounded-md py-2.5 px-3 pr-10 text-xs md:text-sm focus:outline-none shadow-inner"
                           placeholder="Nhập họ và tên của bạn">
                    <button onclick="clearInput('user-name')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-emerald-800 hover:text-emerald-950">
                        <i class="fa-solid fa-circle-xmark text-base"></i>
                    </button>
                </div>
            </div>

            <!-- SỐ ĐIỆN THOẠI (🔴 Đã xóa value cứng, yêu cầu tự nhập) -->
            <div class="space-y-1">
                <label class="block text-xs font-bold text-white uppercase tracking-wider">SỐ ĐIỆN THOẠI <span class="text-red-400">*</span></label>
                <div class="relative flex items-center">
                    <div class="absolute left-3 flex items-center space-x-1.5 text-xs text-gray-800 z-10 pointer-events-none">
                        <span class="text-base">🇻🇳</span>
                        <span class="font-medium">+ 84</span>
                        <i class="fa-solid fa-caret-down text-[10px] text-gray-500"></i>
                    </div>
                    <input type="tel" id="user-phone" value=""
                           class="w-full bg-white text-gray-900 rounded-md py-2.5 pl-20 pr-10 text-xs md:text-sm focus:outline-none shadow-inner"
                           placeholder="Nhập số điện thoại">
                    <button onclick="clearInput('user-phone')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-emerald-800 hover:text-emerald-950">
                        <i class="fa-solid fa-circle-xmark text-base"></i>
                    </button>
                </div>
            </div>

            <!-- GHI CHÚ CHO CHỦ SÂN -->
            <div class="space-y-1">
                <label class="block text-xs font-bold text-white uppercase tracking-wider">GHI CHÚ CHO CHỦ SÂN</label>
                <input type="text" id="user-note" placeholder="Nhập ghi chú"
                       class="w-full bg-white text-gray-900 rounded-md py-2.5 px-3 text-xs md:text-sm focus:outline-none shadow-inner">
            </div>
        </section>

    </main>
</div>

<!-- ================= NÚT XÁC NHẬN CỐ ĐỊNH Ở ĐÁY ================= -->
<footer class="p-4 bg-[#005a32] border-t border-emerald-800/80 sticky bottom-0">
    <div class="max-w-4xl mx-auto">
        <button onclick="confirmAndGoToPayment()"
                class="w-full bg-[#ebad23] hover:bg-[#d99d18] text-white font-extrabold py-3.5 px-4 rounded-lg uppercase tracking-wider text-sm transition shadow-lg flex items-center justify-center cursor-pointer">
            XÁC NHẬN & THANH TOÁN
        </button>
    </div>
</footer>

<!-- ================= JAVASCRIPT XỬ LÝ ================= -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        loadBookingSummary();
    });

    function loadBookingSummary() {
        const urlParams = new URLSearchParams(window.location.search);
        const dataStr = localStorage.getItem("bookingData");
        const data = dataStr ? JSON.parse(dataStr) : {};

        // Lấy tên và địa chỉ từ URL nếu có, nếu không thì lấy từ localStorage
        const stadiumName = urlParams.get('name') || data.stadiumName;
        const stadiumAddress = urlParams.get('address') || data.stadiumAddress;
        const stadiumPhone = urlParams.get('phone') || data.stadiumPhone || "0865658675";

        // Điền thông tin CLB
        document.getElementById("stadium-name").textContent = stadiumName || "Sân Cầu Lông Smart Stadium";
        document.getElementById("stadium-address").textContent = stadiumAddress || "Địa chỉ đang cập nhật";
        document.getElementById("stadium-phone").textContent = stadiumPhone;

        // Điền thông tin lịch đặt
        document.getElementById("booking-date").textContent = formatBookingDate(data.rawBookingDate || data.bookingDate) || new Date().toLocaleDateString('vi-VN');
        document.getElementById("total-hours").textContent = data.totalHours || "3h00";
        document.getElementById("total-price").textContent = data.totalPrice || "360.000 đ";
        document.getElementById("final-price").textContent = data.totalPrice || "360.000 đ";

        if (data.sportType) {
            document.getElementById("sport-type-display").textContent = "Sân " + data.sportType.toLowerCase();
        }

        // Hiển thị danh sách ca sân đã chọn
        const container = document.getElementById("court-summary-list");
        container.innerHTML = "";

        if (data.courtSummary) {
            const courts = data.courtSummary.split(',');
            courts.forEach(c => {
                const p = document.createElement("p");
                p.innerHTML = `- <strong class="text-white">${c.trim()}</strong> | <span class="text-yellow-300 font-bold">${data.totalPrice || ''}</span>`;
                container.appendChild(p);
            });
        } else {
            container.innerHTML = `<p>- <strong class="text-white">Sân Cầu Lông 1: 05h30 - 08h30</strong> | <span class="text-yellow-300 font-bold">360.000 đ</span></p>`;
        }
    }

    function clearInput(id) {
        document.getElementById(id).value = "";
        document.getElementById(id).focus();
    }

    function formatBookingDate(value) {
        if (!value) return "";
        const isoDate = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (isoDate) return `${isoDate[3]}/${isoDate[2]}/${isoDate[1]}`;
        const localDate = value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        return localDate ? value : "";
    }

    function returnToBookingOrigin() {
        const data = JSON.parse(localStorage.getItem("bookingData") || "{}");
        if (data.returnUrl) {
            const returnUrl = new URL(data.returnUrl, window.location.href);
            if (returnUrl.origin === window.location.origin) {
                window.location.href = returnUrl.href;
                return;
            }
        }
        window.history.back();
    }

    function confirmAndGoToPayment() {
        const name = document.getElementById("user-name").value.trim();
        let phone = document.getElementById("user-phone").value.trim();
        const note = document.getElementById("user-note").value.trim();

        // Kiểm tra bắt buộc nhập tên và SĐT
        if (!name) {
            alert("Vui lòng nhập họ và tên của bạn!");
            document.getElementById("user-name").focus();
            return;
        }
        if (!phone) {
            alert("Vui lòng nhập số điện thoại liên hệ!");
            document.getElementById("user-phone").focus();
            return;
        }

        // Chuẩn hóa SĐT
        if (!phone.startsWith("0") && !phone.startsWith("+84")) {
            phone = "0" + phone;
        }

        // Cập nhật lại localStorage kèm thông tin cá nhân và thông tin sân thực tế
        const dataStr = localStorage.getItem("bookingData");
        const data = dataStr ? JSON.parse(dataStr) : {};

        data.stadiumName = document.getElementById("stadium-name").textContent;
        data.stadiumAddress = document.getElementById("stadium-address").textContent;
        data.userName = name;
        data.userPhone = phone;
        data.userNote = note;
        data.bookingId = data.id || data.bookingId;
        if (!Number.isSafeInteger(Number(data.bookingId)) || Number(data.bookingId) <= 0) {
            alert("Đơn đặt sân chưa được lưu vào CSDL. Vui lòng quay lại lưới sân và thử lại.");
            return;
        }

        localStorage.setItem("bookingData", JSON.stringify(data));

        // CHUYỂN HƯỚNG SANG TRANG PAYMENT.HTML
        window.location.href = "payment.html";
    }
</script>
</body>
</html>
