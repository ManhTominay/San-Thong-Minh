<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẶT LỊCH SÂN BÓNG CHUYỀN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#dcf0e2] min-h-screen flex flex-col justify-between font-sans pb-36">

<div>
    <header class="bg-[#005229] text-white px-4 py-3 flex items-center justify-between shadow-md">
        <button onclick="goBackToPreviousPage()" class="text-white hover:opacity-80 text-lg px-2"><i class="fa-solid fa-chevron-left"></i></button>
        <h1 class="text-sm md:text-base font-bold uppercase" id="stadium-header-title">ĐẶT LỊCH SÂN BÓNG CHUYỀN</h1>
        <div class="bg-[#216e45] text-white text-xs px-2.5 py-1 rounded flex items-center gap-2 border border-emerald-600 cursor-pointer" onclick="document.getElementById('booking-date').showPicker()">
            <span id="display-date"></span>
            <i class="fa-regular fa-calendar text-xs"></i>
            <input type="date" id="booking-date" class="hidden" onchange="handleDateChange(this.value)">
        </div>
    </header>

    <div class="bg-[#005229] text-white px-4 py-2 flex items-center gap-4 text-[11px]">
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-white border border-gray-300 rounded-sm inline-block"></span><span>Trống</span></div>
        <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-[#ef4444] rounded-sm inline-block"></span><span>Đã đặt</span></div>
        <button onclick="openPriceModal()" class="text-[#facc15] underline font-semibold ml-2 cursor-pointer">Xem bảng giá</button>
    </div>

    <main class="p-2">
        <div class="overflow-x-auto border border-gray-300 bg-white shadow-sm">
            <table class="w-full border-collapse text-center text-xs select-none">
                <thead>
                <tr class="bg-[#d1e9fa] text-gray-700 border-b border-gray-300" id="header-row">
                    <th class="p-2 border-r border-gray-300 min-w-[140px] bg-[#d1eedb] text-emerald-950 sticky left-0 z-10 font-bold">Sân</th>
                </tr>
                </thead>
                <tbody id="grid-body"></tbody>
            </table>
        </div>
    </main>
</div>

<div id="price-modal" class="fixed inset-0 z-[60] bg-black/60 hidden items-center justify-center p-2 md:p-4 backdrop-blur-sm">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-y-auto relative p-4 text-gray-800">
        <button onclick="closePriceModal()" class="absolute top-3 right-3 text-white bg-black/40 hover:bg-black/70 rounded-full w-8 h-8 flex items-center justify-center z-10" aria-label="Đóng bảng giá">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="bg-[#005229] text-white text-center py-3 font-bold rounded-t">Bảng giá sân Bóng chuyền</h2>
        <div class="overflow-x-auto mt-2">
            <table class="w-full border-collapse text-center text-xs md:text-sm">
                <thead>
                    <tr class="bg-emerald-100 font-bold"><th colspan="3" class="p-3 border">FULL SÂN - BÓNG CHUYỀN</th></tr>
                    <tr class="bg-gray-50 font-bold"><th class="p-3 border">Thứ</th><th class="p-3 border">Khung giờ</th><th class="p-3 border">Giá / giờ</th></tr>
                </thead>
                <tbody>
                    <tr><td rowspan="2" class="p-3 border">T2 - CN</td><td class="p-3 border">6h - 17h</td><td class="p-3 border">300.000 đ</td></tr>
                    <tr><td class="p-3 border">17h - 23h</td><td class="p-3 border">350.000 đ</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="fixed bottom-0 left-0 right-0 z-30 bg-[#005229] text-white shadow-lg">
    <div class="px-6 py-2 flex items-center justify-between text-sm font-bold">
        <span>Tổng giờ: <span id="total-hours">0h00</span></span>
        <span>Tổng tiền: <span id="total-price">0 đ</span></span>
    </div>
    <div class="p-2 bg-[#dcf0e2]">
        <button onclick="goToConfirmPage()" class="w-full bg-[#e3a82b] hover:bg-[#d1971f] text-white font-bold py-3 rounded uppercase text-sm shadow">TIẾP THEO</button>
    </div>
</footer>

<script>
    const BASE_BOOKING_API = "/api/bookings";
    let timeSlots = [];
    const courtsList = ['Sân Bóng Chuyền 1', 'Sân Bóng Chuyền 2', 'Sân Bóng Chuyền 3', 'Sân Bóng Chuyền 4'];
    const selectedSlots = new Set();
    let bookedSlots = new Set();
    let currentStadiumId = '5';
    let currentStadiumName = 'Sân Bóng Chuyền';
    let currentStadiumAddress = '';

    document.addEventListener("DOMContentLoaded", async () => {
        const params = new URLSearchParams(window.location.search);
        currentStadiumId = params.get('stadiumId') || params.get('fieldId') || currentStadiumId;
        currentStadiumName = params.get('name') || currentStadiumName;
        currentStadiumAddress = params.get('address') || currentStadiumAddress;
        const selectedDate = params.get('date') || getLocalDateIso();
        document.getElementById('booking-date').value = selectedDate;
        updateDisplayDate(selectedDate);
        document.getElementById('stadium-header-title').textContent = currentStadiumName.toUpperCase();
        initSportConfig();
        renderHeader();
        try {
            await fetchBookedSlotsFromBackend();
        } catch (error) {
            console.error("Không thể tải lịch Bóng chuyền:", error);
            alert("Không thể tải lịch đặt sân Bóng chuyền. Vui lòng tải lại trang.");
        }
        renderGrid();
    });

    function getLocalDateIso() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function updateDisplayDate(value) {
        const parts = value.split('-');
        if (parts.length === 3) document.getElementById('display-date').textContent = `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function initSportConfig() {
        timeSlots = [];
        for (let h = 7; h <= 22; h++) {
            const hStr = h < 10 ? '0' + h : '' + h;
            timeSlots.push(`${hStr}:00`);
            if (h < 22) timeSlots.push(`${hStr}:30`);
        }
    }

    function openPriceModal() {
        const modal = document.getElementById('price-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closePriceModal() {
        const modal = document.getElementById('price-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    async function fetchBookedSlotsFromBackend() {
        bookedSlots.clear();
        const dateVal = document.getElementById('booking-date').value;
        const res = await fetch(`${BASE_BOOKING_API}?stadiumId=${encodeURIComponent(currentStadiumId)}&bookingDate=${dateVal}`);
        if (!res.ok) throw new Error(`Không tải được lịch Bóng chuyền (${res.status})`);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error("Dữ liệu lịch Bóng chuyền không hợp lệ");
        data.forEach(booking => {
            if ((booking.status || '').toUpperCase() === 'CANCELLED') return;
            if (!bookingMatchesSport(booking, "volleyball", currentStadiumId, currentStadiumName)) return;
            const parts = (booking.courtSummary || '').split('|').filter(Boolean);
            if (parts.length) {
                parts.forEach(part => {
                    const courtMatch = part.match(/(?:bóng\s*chuyền|sân)\s*(\d+)/i);
                    const times = part.match(/(\d{1,2})[h:](\d{2})\s*-\s*(\d{1,2})[h:](\d{2})/i);
                    if (courtMatch && times) {
                        markBookedRange(courtMatch[1], `${times[1].padStart(2, '0')}:${times[2]}`, `${times[3].padStart(2, '0')}:${times[4]}`);
                    }
                });
            } else if (booking.startTime && booking.endTime) {
                markBookedRange('1', booking.startTime, booking.endTime);
            }
        });
    }

    function markBookedRange(courtId, startTime, endTime) {
        let inRange = false;
        timeSlots.forEach(slot => {
            if (slot === startTime.substring(0, 5)) inRange = true;
            if (slot === endTime.substring(0, 5)) inRange = false;
            if (inRange) bookedSlots.add(`${courtId}_${slot}`);
        });
    }

    function renderHeader() {
        const hRow = document.getElementById('header-row');
        hRow.innerHTML = '<th class="p-2 border-r border-gray-300 min-w-[140px] bg-[#d1eedb] text-emerald-950 sticky left-0 z-10 font-bold">Sân</th>';
        timeSlots.forEach(slot => {
            const th = document.createElement('th');
            th.className = "p-1 border-r border-gray-300 font-normal text-[11px] text-gray-600 bg-[#d1e9fa] min-w-[45px]";
            th.textContent = slot;
            hRow.appendChild(th);
        });
    }

    function renderGrid() {
        const tbody = document.getElementById('grid-body');
        tbody.innerHTML = '';
        courtsList.forEach((cName, idx) => {
            const cId = idx + 1;
            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-300";
            const tdName = document.createElement('td');
            tdName.className = "p-2 border-r border-gray-300 font-semibold bg-[#d1eedb] text-emerald-950 sticky left-0 z-10 text-xs";
            tdName.textContent = cName;
            tr.appendChild(tdName);

            timeSlots.forEach(slot => {
                const td = document.createElement('td');
                const key = `${cId}_${slot}`;
                td.className = "border-r border-gray-300 h-8 min-w-[45px]";
                if (bookedSlots.has(key)) {
                    td.className += " bg-[#ef4444] cursor-not-allowed pointer-events-none";
                } else if (selectedSlots.has(key)) {
                    td.className += " bg-[#a2f0c1] border border-black cursor-pointer";
                    td.onclick = () => { selectedSlots.delete(key); renderGrid(); updateTotal(); };
                } else {
                    td.className += " bg-white hover:bg-emerald-50 cursor-pointer";
                    td.onclick = () => { selectedSlots.add(key); renderGrid(); updateTotal(); };
                }
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function getVolleyballSlotPrice(timeSlot) {
        const [h, m] = timeSlot.split(':').map(Number);
        const floatHour = h + (m / 60);
        return (floatHour >= 17 ? 350000 : 300000) / 2;
    }

    function updateTotal() {
        const count = selectedSlots.size;
        const hrs = Math.floor(count / 2), mins = (count % 2) * 30;
        document.getElementById('total-hours').textContent = `${hrs}h${mins === 0 ? '00' : mins}`;
        let total = 0;
        selectedSlots.forEach(k => { total += getVolleyballSlotPrice(k.split('_')[1]); });
        document.getElementById('total-price').textContent = Math.round(total).toLocaleString('vi-VN') + " đ";
    }

    function validateBooking() {
        if (selectedSlots.size === 0) {
            alert("Vui lòng chọn khung giờ!");
            return false;
        }

        const courts = new Map();
        selectedSlots.forEach(key => {
            const [courtId, slot] = key.split('_');
            const slotIndex = timeSlots.indexOf(slot);
            if (slotIndex < 0) return;
            if (!courts.has(courtId)) courts.set(courtId, []);
            courts.get(courtId).push(slotIndex);
        });

        for (const [courtId, indexes] of courts) {
            indexes.sort((a, b) => a - b);
            const blocks = [];
            let block = [indexes[0]];
            for (let i = 1; i < indexes.length; i++) {
                if (indexes[i] === indexes[i - 1] + 1) block.push(indexes[i]);
                else {
                    blocks.push(block);
                    block = [indexes[i]];
                }
            }
            blocks.push(block);

            if (blocks.some(item => item.length < 2)) {
                alert(`Sân Bóng chuyền ${courtId}: Mỗi ca phải đặt tối thiểu 1 tiếng (2 ô 30 phút liền kề).`);
                return false;
            }
            for (let i = 0; i < blocks.length - 1; i++) {
                if (blocks[i + 1][0] - blocks[i][blocks[i].length - 1] === 2) {
                    alert(`Sân Bóng chuyền ${courtId}: Không được để trống 1 ô 30 phút xen giữa các ca.`);
                    return false;
                }
            }
        }
        return true;
    }

    async function goToConfirmPage() {
        if (!validateBooking()) return;
        const dateVal = document.getElementById('booking-date').value;
        const sorted = Array.from(selectedSlots).sort();
        const grouped = {};
        sorted.forEach(k => {
            const [c, t] = k.split('_');
            if (!grouped[c]) grouped[c] = [];
            grouped[c].push(t);
        });

        let startTimes = [], endTimes = [], details = [];
        Object.keys(grouped).forEach(cId => {
            const idxs = grouped[cId].map(t => timeSlots.indexOf(t)).sort((a,b) => a-b);
            const sStr = timeSlots[idxs[0]];
            const eStr = timeSlots[idxs[idxs.length-1] + 1] || timeSlots[idxs[idxs.length-1]];
            startTimes.push(sStr + ":00");
            endTimes.push(eStr + ":00");
            details.push(`Bóng Chuyền ${cId}: ${sStr} - ${eStr}`);
        });

        startTimes.sort(); endTimes.sort();
        const payload = {
            userId: parseInt(localStorage.getItem("userId") || "7", 10),
            fieldId: parseInt(currentStadiumId, 10),
            stadiumId: parseInt(currentStadiumId, 10),
            stadiumName: currentStadiumName,
            stadiumAddress: currentStadiumAddress,
            bookingDate: dateVal,
            rawBookingDate: dateVal,
            startTime: startTimes[0],
            endTime: endTimes[endTimes.length - 1],
            courtSummary: details.join(' | '),
            totalPrice: parseFloat(document.getElementById('total-price').textContent.replace(/[^0-9]/g, '')),
            status: "PENDING"
        };

        try {
            Object.assign(payload, await saveBookingRecord(payload));
            payload.savedToDb = true;
        } catch(error) {
            console.error("Không lưu được booking Bóng chuyền:", error);
            alert(`Không thể lưu lịch đặt sân: ${error.message}`);
            return;
        }

        localStorage.setItem("bookingData", JSON.stringify(payload));
        window.location.href = "confirm.html";
    }

    async function handleDateChange(val) {
        if (!val) return;
        updateDisplayDate(val);
        selectedSlots.clear();
        try {
            await fetchBookedSlotsFromBackend();
        } catch (error) {
            console.error("Không thể tải lịch Bóng chuyền:", error);
            alert("Không thể tải lịch đặt sân Bóng chuyền. Vui lòng thử lại.");
        }
        renderGrid();
        updateTotal();
    }
</script>
<script src="booking-api.js"></script>
<script src="booking-navigation.js"></script>
</body>
</html>
