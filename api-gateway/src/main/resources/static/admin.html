<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Smart Stadium Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

<div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <div class="w-64 bg-emerald-900 text-white flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-5 text-xl font-bold border-b border-emerald-800 flex items-center space-x-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                <span>Smart Stadium Admin</span>
            </div>
            <nav class="p-4 space-y-2">
                <a href="#" onclick="switchTab('stadiums')" id="nav-stadiums" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-emerald-800 text-white font-medium transition">
                    <i class="fa-solid fa-futbol w-5"></i>
                    <span>Quản lý Sân thể thao</span>
                </a>
                <a href="#" onclick="switchTab('users')" id="nav-users" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-emerald-200 hover:bg-emerald-800 hover:text-white transition">
                    <i class="fa-solid fa-users w-5"></i>
                    <span>Quản lý Tài khoản</span>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-emerald-800">
            <button onclick="handleLogout()" class="w-full flex items-center justify-center space-x-2 bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg text-sm font-medium transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Đăng xuất</span>
            </button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 flex flex-col overflow-y-auto">

        <!-- HEADER -->
        <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6">
            <h1 id="page-title" class="text-lg font-bold text-gray-800">Quản Lý Sân Thể Thao</h1>
            <div class="flex items-center space-x-3">
                <span class="text-sm text-gray-600 font-medium" id="admin-email">Admin</span>
                <div class="w-9 h-9 rounded-full bg-emerald-700 text-white flex items-center justify-center font-bold">A</div>
            </div>
        </header>

        <!-- CONTENT BODY -->
        <main class="p-6">

            <!-- TAB 1: QUẢN LÝ SÂN -->
            <div id="tab-stadiums-content" class="space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-gray-700">Danh sách sân trong hệ thống</h2>
                    <button onclick="openAddStadiumModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Thêm sân mới</span>
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase">
                            <th class="p-4">ID</th>
                            <th class="p-4">Tên sân</th>
                            <th class="p-4">Loại môn</th>
                            <th class="p-4">Địa chỉ</th>
                            <th class="p-4 text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="admin-stadium-table" class="text-xs divide-y divide-gray-100">
                        <!-- Dữ liệu sân sẽ được load bằng JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: QUẢN LÝ TÀI KHOẢN -->
            <div id="tab-users-content" class="space-y-6 hidden">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-gray-700">Danh sách tài khoản người dùng</h2>
                    <button onclick="openAddUserModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center space-x-2">
                        <i class="fa-solid fa-user-plus"></i>
                        <span>Thêm tài khoản mới</span>
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs text-gray-500 uppercase">
                            <th class="p-4">ID</th>
                            <th class="p-4">Email / Tài khoản</th>
                            <th class="p-4">Vai trò</th>
                            <th class="p-4 text-center">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody id="admin-user-table" class="text-xs divide-y divide-gray-100">
                        <!-- Dữ liệu tài khoản sẽ được load tự động bằng JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Hiển thị email admin từ localStorage nếu có
        const userEmail = localStorage.getItem("userEmail") || "admin@stadium.com";
        document.getElementById("admin-email").textContent = userEmail;

        // Tải dữ liệu sân mặc định
        loadAdminStadiums();
    });

    // Chuyển đổi giữa các tab quản lý
    function switchTab(tabName) {
        const tabStadiums = document.getElementById("tab-stadiums-content");
        const tabUsers = document.getElementById("tab-users-content");
        const navStadiums = document.getElementById("nav-stadiums");
        const navUsers = document.getElementById("nav-users");
        const pageTitle = document.getElementById("page-title");

        if (tabName === 'stadiums') {
            tabStadiums.classList.remove("hidden");
            tabUsers.classList.add("hidden");
            navStadiums.className = "flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-emerald-800 text-white font-medium transition";
            navUsers.className = "flex items-center space-x-3 px-4 py-2.5 rounded-lg text-emerald-200 hover:bg-emerald-800 hover:text-white transition";
            pageTitle.textContent = "Quản Lý Sân Thể Thao";
            loadAdminStadiums();
        } else {
            tabUsers.classList.remove("hidden");
            tabStadiums.classList.add("hidden");
            navUsers.className = "flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-emerald-800 text-white font-medium transition";
            navStadiums.className = "flex items-center space-x-3 px-4 py-2.5 rounded-lg text-emerald-200 hover:bg-emerald-800 hover:text-white transition";
            pageTitle.textContent = "Quản Lý Tài Khoản";
            loadAdminUsers();
        }
    }

    // Tải danh sách sân cho trang Admin
    function loadAdminStadiums() {
        fetch('http://localhost:8083/api/fields')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("admin-stadium-table");
                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Chưa có sân nào trong hệ thống.</td></tr>`;
                    return;
                }
                data.forEach(stadium => {
                    tbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-4 font-semibold text-gray-700">${stadium.id}</td>
                                <td class="p-4 font-medium text-emerald-800">${stadium.name}</td>
                                <td class="p-4"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-semibold">${stadium.type || 'N/A'}</span></td>
                                <td class="p-4 text-gray-600">${stadium.address || 'Đang cập nhật'}</td>
                                <td class="p-4 text-center space-x-2">
                                    <button onclick="deleteStadium(${stadium.id})" class="text-rose-600 hover:text-rose-800 font-medium px-2 py-1 rounded bg-rose-50 transition">Xóa</button>
                                </td>
                            </tr>
                        `;
                });
            })
            .catch(err => console.error("Lỗi tải sân:", err));
    }

    // Tải danh sách tài khoản thực tế từ API Backend
    function loadAdminUsers() {
        fetch('http://localhost:8083/api/admin/users')
            .then(res => {
                if (!res.ok) {
                    throw new Error("Phản hồi từ máy chủ không hợp lệ: " + res.status);
                }
                return res.json();
            })
            .then(data => {
                const tbody = document.getElementById("admin-user-table");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">Chưa có tài khoản nào trong hệ thống.</td></tr>`;
                    return;
                }

                data.forEach(user => {
                    const roleBadge = user.role === 'ADMIN' || user.role === 'ROLE_ADMIN'
                        ? `<span class="px-2 py-0.5 bg-purple-100 text-purple-800 rounded font-semibold">ADMIN</span>`
                        : `<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-semibold">USER</span>`;

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-4 font-semibold text-gray-700">${user.id}</td>
                            <td class="p-4 font-medium text-gray-800">${user.email || user.username}</td>
                            <td class="p-4">${roleBadge}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="toggleUserRole(${user.id}, '${user.role}')" class="text-indigo-600 hover:text-indigo-800 font-medium px-2.5 py-1 rounded bg-indigo-50 transition text-xs">
                                    Đổi Quyền
                                </button>
                                <button onclick="deleteUser(${user.id})" class="text-rose-600 hover:text-rose-800 font-medium px-2.5 py-1 rounded bg-rose-50 transition text-xs">
                                    Xóa
                                </button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                console.error("Lỗi tải danh sách người dùng:", err);
                const tbody = document.getElementById("admin-user-table");
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Không thể tải dữ liệu tài khoản từ máy chủ. Vui lòng kiểm tra lại quyền đăng nhập hoặc kết nối.</td></tr>`;
            });
    }

    // Hàm thay đổi quyền (Role) của user
    function toggleUserRole(userId, currentRole) {
        const newRole = (currentRole === 'ADMIN' || currentRole === 'ROLE_ADMIN') ? 'USER' : 'ADMIN';
        if (confirm(`Bạn có chắc muốn đổi quyền của tài khoản này thành ${newRole} không?`)) {
            fetch(`http://localhost:8083/api/admin/users/${userId}/role`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            })
                .then(res => {
                    if (res.ok) {
                        alert("Cập nhật quyền thành công!");
                        loadAdminUsers();
                    } else {
                        alert("Cập nhật quyền thất bại!");
                    }
                })
                .catch(err => console.error("Lỗi:", err));
        }
    }

    // Hàm xóa người dùng
    function deleteUser(userId) {
        if (confirm("Bạn có chắc chắn muốn xóa tài khoản này khỏi hệ thống không?")) {
            fetch(`http://localhost:8083/api/admin/users/${userId}`, {
                method: 'DELETE'
            })
                .then(res => {
                    if (res.ok) {
                        alert("Xóa tài khoản thành công!");
                        loadAdminUsers();
                    } else {
                        alert("Xóa thất bại!");
                    }
                })
                .catch(err => console.error("Lỗi khi xóa:", err));
        }
    }

    // Xóa sân
    function deleteStadium(id) {
        if (confirm("Bạn có chắc chắn muốn xóa sân này không?")) {
            fetch(`http://localhost:8083/api/fields/${id}`, {
                method: 'DELETE'
            })
                .then(res => {
                    if (res.ok) {
                        alert("Xóa thành công!");
                        loadAdminStadiums();
                    } else {
                        alert("Xóa thất bại!");
                    }
                })
                .catch(err => console.error("Lỗi khi xóa:", err));
        }
    }

    // Đăng xuất
    function handleLogout() {
        localStorage.removeItem("token");
        localStorage.removeItem("userEmail");
        window.location.href = "/login.html";
    }

    function openAddStadiumModal() {
        alert("Tính năng mở form thêm sân mới (Bạn có thể tạo một modal hoặc trang thêm sân tương ứng).");
    }
    // Mở modal thêm user
    function openAddUserModal() {
        document.getElementById("addUserModal").classList.remove("hidden");
    }

    // Đóng modal thêm user
    function closeAddUserModal() {
        document.getElementById("addUserModal").classList.add("hidden");
        document.getElementById("addUserForm").reset();
    }

    // Gửi request tạo tài khoản mới lên Backend
    function handleCreateUser(event) {
        event.preventDefault();

        const email = document.getElementById("newEmail").value;
        const password = document.getElementById("newPassword").value;
        const role = document.getElementById("newRole").value;

        const userData = {
            email: email,
            username: email, // Tuỳ thuộc backend của bạn dùng trường nào
            password: password,
            role: role
        };

        fetch('http://localhost:8083/api/admin/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
        })
            .then(res => {
                if (res.ok) {
                    alert("Thêm tài khoản thành công!");
                    closeAddUserModal();
                    loadAdminUsers(); // Tải lại danh sách
                } else {
                    alert("Thêm tài khoản thất bại! Vui lòng kiểm tra lại thông tin.");
                }
            })
            .catch(err => {
                console.error("Lỗi khi tạo user:", err);
                alert("Không thể kết nối đến máy chủ.");
            });
    }
</script>
<!-- MODAL THÊM TÀI KHOẢN -->
<div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-lg">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="text-base font-bold text-gray-800">Thêm Tài Khoản Mới</h3>
            <button onclick="closeAddUserModal()" class="text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <form id="addUserForm" onsubmit="handleCreateUser(event)" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Email / Tên tài khoản</label>
                <input type="text" id="newEmail" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="vd: user@gmail.com">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="newPassword" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
            </div>
            <div>
                <label class="block font-semibold text-gray-700 mb-1">Vai trò (Role)</label>
                <select id="newRole" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="USER">USER (Người dùng)</option>
                    <option value="ADMIN">ADMIN (Quản trị viên)</option>
                </select>
            </div>
            <div class="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onclick="closeAddUserModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-medium transition">Hủy</button>
                <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition">Tạo tài khoản</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
