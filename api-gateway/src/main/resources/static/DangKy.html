<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Smart Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12">

<div class="bg-white p-8 rounded-2xl shadow-sm w-full max-w-md border border-gray-100">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-emerald-600">Smart Stadium</h1>
        <p class="text-xs text-gray-500 mt-1">Tạo tài khoản mới để trải nghiệm dịch vụ</p>
    </div>

    <form id="register-form" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Họ và tên</label>
            <input type="text" id="name" required class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="Nguyễn Văn A">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Địa chỉ Email</label>
            <input type="email" id="email" required class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="example@gmail.com">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Số điện thoại</label>
            <input type="tel" id="phone" required class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="0912345678">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Mật khẩu</label>
            <input type="password" id="password" required class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500 bg-gray-50/50" placeholder="••••••">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Xác nhận mật khẩu</label>
            <input type="password" id="confirm_password" required class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="Nhập lại mật khẩu">
        </div>

        <div id="error-message" class="text-red-500 text-xs text-center hidden"></div>
        <div id="success-message" class="text-emerald-600 text-xs text-center hidden"></div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-sm py-2.5 rounded-lg transition shadow-sm mt-2">
            Tạo tài khoản
        </button>
    </form>

    <p class="text-center text-xs text-gray-600 mt-6">
        Đã có tài khoản? <a href="/login.html" class="text-emerald-600 font-semibold hover:underline">Đăng nhập</a>
    </p>
    <div class="text-center mt-3">
        <a href="/" class="text-xs text-gray-400 hover:text-gray-600">← Quay lại trang chủ</a>
    </div>
</div>

<script>
    document.getElementById("register-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;

        const errorDiv = document.getElementById("error-message");
        const successDiv = document.getElementById("success-message");

        errorDiv.classList.add("hidden");
        successDiv.classList.add("hidden");

        if (password !== confirmPassword) {
            errorDiv.textContent = "Mật khẩu xác nhận không khớp!";
            errorDiv.classList.remove("hidden");
            return;
        }

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone,
                    password: password
                })
            });

            if (response.ok) {
                successDiv.textContent = "Tạo tài khoản thành công! Đang chuyển hướng...";
                successDiv.classList.remove("hidden");
                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1500);
            } else {
                const errText = await response.text();
                errorDiv.textContent = errText || "Đăng ký thất bại. Vui lòng kiểm tra lại thông tin.";
                errorDiv.classList.remove("hidden");
            }
        } catch (err) {
            console.error("Lỗi:", err);
            errorDiv.textContent = "Không thể kết nối đến máy chủ!";
            errorDiv.classList.remove("hidden");
        }
    });
</script>

</body>
</html>
