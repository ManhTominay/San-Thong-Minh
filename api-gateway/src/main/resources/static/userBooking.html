<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Đặt Sân - Smart Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f4f6f8; }
        .card { box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05); }
    </style>
</head>

<body class="min-h-screen text-gray-800">

<header class="bg-emerald-600 text-white shadow-md relative z-50">
    <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
            <i class="fa-solid fa-shield-halved text-xl"></i>
            <span class="text-xl font-bold">Smart Stadium</span>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="bg-emerald-700 hover:bg-emerald-800 px-4 py-2 rounded-lg text-sm transition cursor-pointer">
                <i class="fa-solid fa-house mr-1"></i> Trang chủ
            </button>

            <div class="relative group inline-block text-left" id="user-menu-wrapper">
                <button onclick="toggleUserDropdown(event)"
                        class="bg-[#00582f] hover:bg-[#004223] text-white text-xs md:text-sm font-medium py-2 px-3.5 rounded-full flex items-center space-x-2 transition shadow-sm border border-emerald-600/50 cursor-pointer">
                    <i class="fa-regular fa-user text-sm"></i>
                    <span>Xin chào, <span id="user-display-email">...</span></span>
                    <i class="fa-solid fa-chevron-down text-[10px] ml-1 text-emerald-200"></i>
                </button>

                <div id="user-dropdown-menu"
                     class="hidden group-hover:block absolute right-0 mt-1 w-60 bg-white rounded-xl shadow-2xl py-2 border border-gray-100 text-gray-700 text-sm transition-all duration-150 origin-top-right">

                    <div class="px-4 py-2 border-b border-gray-100 bg-gray-50/50 rounded-t-xl">
                        <p class="text-[11px] text-gray-400 font-medium">Tài khoản đăng nhập</p>
                        <p class="font-semibold text-gray-800 truncate text-xs" id="dropdown-user-email">...</p>
                    </div>

                    <a href="profile.html" class="flex items-center px-4 py-2.5 hover:bg-emerald-50 hover:text-[#005229] transition space-x-3 group/item">
                        <i class="fa-regular fa-id-card text-emerald-600 group-hover/item:scale-110 transition-transform w-4"></i>
                        <span class="font-medium">Hồ sơ cá nhân</span>
                    </a>

                    <a href="userBooking.html" class="flex items-center px-4 py-2.5 bg-emerald-50 text-[#005229] font-medium space-x-3 group/item">
                        <i class="fa-solid fa-receipt text-emerald-600 group-hover/item:scale-110 transition-transform w-4"></i>
                        <span>Lịch sử đặt sân</span>
                    </a>

                    <div class="border-t border-gray-100 my-1"></div>

                    <button onclick="handleLogout()" class="w-full text-left flex items-center px-4 py-2.5 hover:bg-red-50 text-red-600 transition space-x-3 cursor-pointer group/item">
                        <i class="fa-solid fa-right-from-bracket group-hover/item:scale-110 transition-transform w-4"></i>
                        <span class="font-medium">Đăng xuất</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-5 py-8">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Lịch sử đặt sân</h1>
            <p class="text-sm text-gray-500 mt-1">Danh sách tất cả các sân bạn đã đăng ký và trạng thái thanh toán.</p>
        </div>
        <button onclick="loadBookings()" class="self-start md:self-auto bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i> Làm mới
        </button>
    </div>

    <div id="bookingList" class="space-y-4">
        <div class="card bg-white rounded-2xl p-8 text-center text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i>
            <p>Đang tải lịch sử đặt sân...</p>
        </div>
    </div>
</main>

<script>
    const BASE_BOOKINGS_API = "/api/bookings";

    function resolveCurrentUserId() {
        const userId = Number(localStorage.getItem("userId"));
        return Number.isSafeInteger(userId) && userId > 0 ? String(userId) : "";
    }

    function formatToIsoDate(dateStr) {
        if (!dateStr) {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }
        if (dateStr.includes('-')) {
            const parts = dateStr.split('-');
            if (parts[0].length === 4) return dateStr;
            if (parts[2].length === 4) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
        if (dateStr.includes('/')) {
            const parts = dateStr.split('/');
            if (parts[2].length === 4) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
        }
        return dateStr;
    }

    function formatDateForDisplay(dateStr) {
        const isoDate = formatToIsoDate(dateStr);
        const parts = isoDate.split('-');
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateStr || '--';
    }

    document.addEventListener("DOMContentLoaded", async function () {
        const token = localStorage.getItem("token") || localStorage.getItem("userToken");
        if (!token) {
            await loadBookings();
            return;
        }

        try {
            const response = await fetch("/api/auth/identity", {
                cache: "no-store",
                headers: { "Authorization": `Bearer ${token}` }
            });
            if (!response.ok) {
                throw new Error(response.status === 401
                    ? "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại."
                    : `Không xác minh được tài khoản (HTTP ${response.status}).`);
            }

            const identity = await response.json();
            const userId = Number(identity.id);
            if (!Number.isSafeInteger(userId) || userId <= 0) {
                throw new Error("User Service trả về mã tài khoản không hợp lệ.");
            }
            localStorage.setItem("userId", String(userId));
            if (identity.email) localStorage.setItem("userEmail", identity.email);
            document.getElementById("user-display-email").textContent = identity.email || "Tài khoản";
            document.getElementById("dropdown-user-email").textContent = identity.email || "Tài khoản";

            await syncPendingLocalBookingsToDatabase();
            await loadBookings();
        } catch (error) {
            console.error("Không xác minh được tài khoản đặt sân:", error);
            document.getElementById("bookingList").innerHTML = `
                <div class="card bg-white rounded-2xl p-8 text-center text-rose-600">
                    <p class="font-semibold">${escapeHtml(error.message || "Không xác minh được tài khoản.")}</p>
                    <a href="login.html" class="mt-3 inline-block font-semibold text-emerald-700 underline">Đăng nhập lại</a>
                </div>
            `;
        }
    });

    async function syncPendingLocalBookingsToDatabase() {
        const singleBooking = JSON.parse(localStorage.getItem("bookingData"));

        if (singleBooking && !singleBooking.savedToDb && !singleBooking.id) {
            console.log("👉 Đang đồng bộ đơn mới lên CSDL 8085...", singleBooking);
            const savedResult = await saveBookingToBackend(singleBooking);
            if (savedResult && (savedResult.id || savedResult.bookingId)) {
                singleBooking.id = savedResult.id || savedResult.bookingId;
                singleBooking.savedToDb = true;
                localStorage.setItem("bookingData", JSON.stringify(singleBooking));
            }
        }
    }

    // MAP TÊN SÂN CHUẨN THEO ID SÂN (FIELD ID)
    function getStadiumNameByFieldId(fieldId, fallbackName) {
        if (fallbackName && fallbackName !== "Cụm Sân Cầu Lông" && fallbackName !== "null") {
            return fallbackName;
        }
        const id = parseInt(fieldId, 10);
        switch(id) {
            case 1: return "Sân Bóng Đá Huyền Anh";
            case 2: return "Sân Tennis";
            case 3: return "Cụm Sân Cầu Lông";
            case 4: return "Sân Pickleball";
            case 5: return "Sân Bóng Chuyền";
            default: return fallbackName || "Sân Bóng Đá Huyền Anh";
        }
    }

    async function saveBookingToBackend(bookingData) {
        const currentUserId = resolveCurrentUserId();
        const priceText = bookingData.totalPrice || "0";
        const numericPrice = parseFloat(priceText.toString().replace(/[^0-9]/g, '') || 0);
        const fieldIdNum = parseInt(bookingData.stadiumId || bookingData.fieldId || "1", 10);

        const isoDate = formatToIsoDate(bookingData.bookingDate);

        let startTime = "07:30:00";
        let endTime = "09:00:00";

        if (bookingData.selectedSlotsDetail && bookingData.selectedSlotsDetail.length > 0) {
            let startTimes = [];
            let endTimes = [];

            bookingData.selectedSlotsDetail.forEach(item => {
                if (item.timeSlot) {
                    const times = item.timeSlot.split('-').map(t => t.trim());
                    if (times.length === 2) {
                        startTimes.push(times[0].length === 5 ? times[0] + ":00" : times[0]);
                        endTimes.push(times[1].length === 5 ? times[1] + ":00" : times[1]);
                    }
                }
            });

            if (startTimes.length > 0 && endTimes.length > 0) {
                startTimes.sort();
                endTimes.sort();
                startTime = startTimes[0];
                endTime = endTimes[endTimes.length - 1];
            }
        }

        const stadiumNameCorrect = getStadiumNameByFieldId(fieldIdNum, bookingData.stadiumName);

        const payload = {
            userId: parseInt(currentUserId, 10),
            fieldId: fieldIdNum,
            stadiumName: stadiumNameCorrect,
            stadiumAddress: bookingData.stadiumAddress || bookingData.address || "",
            bookingDate: isoDate,
            startTime: startTime,
            endTime: endTime,
            courtSummary: bookingData.courtSummary || bookingData.courtDetail || "- Ca đặt sân",
            totalPrice: numericPrice,
            status: bookingData.status || "PENDING"
        };

        const token = localStorage.getItem("token") || localStorage.getItem("userToken");

        try {
            console.log("👉 Đang gửi payload chuẩn lên 8085:", payload);
            const response = await fetch(BASE_BOOKINGS_API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token ? `Bearer ${token}` : ''
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                console.log("✅ ĐÃ LƯU THÀNH CÔNG VÀO MYSQL (8085)! ID đơn:", data.id || data.bookingId);
                return data;
            } else {
                const errErr = await response.text();
                console.error("❌ Lỗi Backend 8085 trả về:", response.status, errErr);
            }
        } catch (err) {
            console.error("❌ Không thể kết nối tới cổng 8085:", err);
        }
        return null;
    }

    async function loadBookings() {
        const token = localStorage.getItem("token") || localStorage.getItem("userToken");
        const container = document.getElementById("bookingList");
        if (!token) {
            container.innerHTML = `
                <div class="card bg-white rounded-2xl p-8 text-center text-rose-600">
                    <p class="font-semibold">Phiên đăng nhập không tồn tại hoặc đã hết hạn.</p>
                    <a href="login.html" class="mt-3 inline-block font-semibold text-emerald-700 underline">Đăng nhập lại</a>
                </div>
            `;
            return;
        }

        container.innerHTML = `<div class="card bg-white rounded-2xl p-12 text-center text-gray-500">Đang tải lịch sử đặt sân...</div>`;
        try {
            const response = await fetch(`${BASE_BOOKINGS_API}/my-bookings`, {
                cache: "no-store",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });
            if (response.status === 401) {
                throw new Error("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
            }
            if (!response.ok) {
                const body = await response.text();
                throw new Error(body || `Không tải được lịch sử (HTTP ${response.status}).`);
            }
            const bookings = await response.json();
            if (!Array.isArray(bookings)) {
                throw new Error("Booking Service trả về danh sách lịch sử không hợp lệ.");
            }
            if (bookings.length === 0) {
                container.innerHTML = `
                    <div class="card bg-white rounded-2xl p-12 text-center text-gray-500">
                        <i class="fa-solid fa-calendar-xmark text-4xl text-gray-300 mb-3"></i>
                        <p class="text-base font-semibold text-gray-700">Chưa có lịch sử đặt sân nào</p>
                        <p class="text-xs text-gray-400 mt-1 mb-4">Tài khoản này chưa có đơn hàng nào trong CSDL.</p>
                        <button onclick="goHome()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition cursor-pointer">
                            Đặt sân ngay
                        </button>
                    </div>
                `;
                return;
            }

            renderBookings(bookings);
            await loadCancellationStatuses(bookings, token);
            renderBookings(bookings);
        } catch (error) {
            console.error("Không tải được lịch sử đặt sân:", error);
            container.innerHTML = `
                <div class="card bg-white rounded-2xl p-8 text-center text-rose-600">
                    <p class="font-semibold">${escapeHtml(error.message || "Không tải được lịch sử đặt sân.")}</p>
                    <button onclick="loadBookings()" class="mt-3 rounded-lg bg-emerald-700 px-4 py-2 text-sm font-semibold text-white">Thử lại</button>
                </div>
            `;
        }
    }

    async function loadCancellationStatuses(bookings, token) {
        await Promise.all(bookings.map(async booking => {
            const bookingId = Number(booking.id || booking.bookingId);
            if (!Number.isSafeInteger(bookingId) || bookingId <= 0) return;

            try {
                const response = await fetch(`${BASE_BOOKINGS_API}/${bookingId}/cancellation-requests`, {
                    cache: "no-store",
                    headers: {
                        "Authorization": token ? ["Bear", "er"].join("") + " " + token : "",
                        "Content-Type": "application/json"
                    }
                });
                if (!response.ok) {
                    booking.cancellationRequestLoadError = response.status === 401
                        ? "Phiên đăng nhập đã hết hạn"
                        : response.status === 403
                            ? "Không có quyền xem yêu cầu hủy"
                            : `Không tải được yêu cầu hủy (HTTP ${response.status})`;
                    return;
                }

                const requests = await response.json();
                if (!Array.isArray(requests)) {
                    booking.cancellationRequestLoadError = "Dữ liệu yêu cầu hủy không hợp lệ";
                    return;
                }
                booking.cancellationRequest = requests[0] || null;
            } catch (error) {
                console.error(`Không tải được yêu cầu hủy của đơn #${bookingId}:`, error);
                booking.cancellationRequestLoadError = "Không kết nối được để kiểm tra yêu cầu hủy";
            }
        }));
    }

    function renderBookings(bookings) {
        const container = document.getElementById("bookingList");
        container.innerHTML = bookings.map(item => {
            const itemJson = JSON.stringify(item).replace(/'/g, "&apos;");
            const bookingId = item.id || item.bookingId || '1001';

            let timeSlotDisplay = item.courtSummary || item.courtDetail || item.timeSlot || '--';
            if (item.startTime && item.endTime) {
                timeSlotDisplay = `${item.startTime.substring(0, 5)} - ${item.endTime.substring(0, 5)}`;
            }

            const statusUpper = (item.status || '').toUpperCase();
            const isCancelled = statusUpper === 'CANCELLED' || statusUpper === 'ĐÃ HỦY';

            const displayName = getBookingStadiumName(item);
            const displayAddress = item.stadiumAddress || item.address || "Địa chỉ đang cập nhật";

            return `
                <div class="card bg-white rounded-2xl border border-gray-200 p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-800">
                                Mã đơn: #${bookingId}
                            </span>
                            ${getStatusBadge(item.status)}
                        </div>
                        ${getCancellationRequestBadge(item.cancellationRequest, item.cancellationRequestLoadError)}
                        <h3 class="font-bold text-lg text-gray-800 pt-1">${displayName}</h3>
                        <p class="text-xs text-gray-500">
                            <i class="fa-solid fa-location-dot mr-1"></i> Địa chỉ sân: <strong>${displayAddress}</strong>
                        </p>
                        <p class="text-xs text-gray-500">
                            <i class="fa-regular fa-calendar mr-1"></i> Ngày đặt: <strong>${formatDateForDisplay(item.bookingDate)}</strong>
                        </p>
                        <p class="text-xs text-gray-500">
                            <i class="fa-regular fa-clock mr-1"></i> Chi tiết ca: <strong>${timeSlotDisplay}</strong>
                        </p>
                    </div>

                    <div class="flex flex-col md:items-end justify-between gap-3 border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                        <div>
                            <p class="text-xs text-gray-400 md:text-right">Tổng thanh toán</p>
                            <p class="text-xl font-bold text-emerald-600">${formatCurrency(item.totalPrice)}</p>
                        </div>

                        <div class="flex items-center gap-2">
                            ${!isCancelled && item.cancellationRequest?.status !== "PENDING" ? `
                                <button onclick="requestBookingCancellation(${Number(bookingId)})"
                                        class="bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer border border-rose-200">
                                    <i class="fa-solid fa-calendar-xmark"></i> Yêu cầu hủy
                                </button>
                            ` : ''}
                            ${isCancelled ? `
                                <span class="text-xs font-semibold text-gray-500">Đơn đã hủy</span>
                            ` : ''}

                            <button onclick='viewBookingDetail(${itemJson})'
                                    class="bg-[#005229] hover:bg-[#00381c] text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer shadow-sm">
                                <i class="fa-solid fa-eye text-yellow-300"></i> Xem chi tiết
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function requestBookingCancellation(bookingId) {
        const token = localStorage.getItem("token") || localStorage.getItem("userToken");
        if (!token) {
            alert("Phiên đăng nhập không tồn tại hoặc đã hết hạn. Vui lòng đăng nhập lại.");
            window.location.href = "login.html";
            return;
        }
        if (!Number.isSafeInteger(bookingId) || bookingId <= 0) {
            alert("Mã đơn đặt sân không hợp lệ.");
            return;
        }
        if (!confirm(`Gửi yêu cầu hủy đơn #${bookingId} để Admin xét duyệt? Đơn chưa bị hủy cho đến khi Admin duyệt.`)) {
            return;
        }

        const reason = prompt("Lý do hủy (không bắt buộc):");
        if (reason === null) return;

        try {
            const response = await fetch(`${BASE_BOOKINGS_API}/${bookingId}/cancellation-requests`, {
                method: "POST",
                cache: "no-store",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ reason: reason.trim() })
            });
            if (!response.ok) {
                const body = await response.text();
                let message = body;
                try {
                    const result = JSON.parse(body);
                    message = result.detail || result.message || result.error || body;
                } catch (_) {
                    // Preserve plain-text API errors.
                }
                if (response.status === 401) {
                    message = "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.";
                } else if (response.status === 403) {
                    message = "Tài khoản hiện tại không phải chủ đơn này. Hãy đăng nhập đúng tài khoản đã đặt sân.";
                }
                throw new Error(message || `Không lưu được yêu cầu (HTTP ${response.status}).`);
            }

            const created = await response.json();
            if (Number(created.bookingId) !== bookingId || created.status !== "PENDING") {
                throw new Error("Booking Service chưa xác nhận yêu cầu hủy ở trạng thái chờ duyệt.");
            }
            alert(`Đã lưu yêu cầu hủy đơn #${bookingId} vào CSDL. Admin sẽ xét duyệt.`);
            await loadBookings();
        } catch (error) {
            console.error(`Không lưu được yêu cầu hủy đơn #${bookingId}:`, error);
            alert(error.message || "Không thể kết nối Booking Service; yêu cầu chưa được xác nhận đã lưu.");
        }
    }

    function viewBookingDetail(item) {
        localStorage.setItem("bookingData", JSON.stringify(item));
        window.location.href = "booking-detail.html";
    }

    function getBookingStadiumName(item) {
        if (item.stadiumName && item.stadiumName !== "null") {
            return item.stadiumName;
        }

        const summary = item.courtSummary || item.courtDetail || "";
        if (/cầu\s*lông/i.test(summary)) return "Cụm Sân Cầu Lông";
        if (/pickleball/i.test(summary)) return "Sân Pickleball";
        if (/bóng\s*chuyền/i.test(summary)) return "Sân Bóng Chuyền";
        if (/tennis/i.test(summary)) return "Sân Tennis";
        if (/bóng\s*đá/i.test(summary)) return "Sân Bóng Đá";

        return getStadiumNameByFieldId(item.fieldId, item.stadiumName);
    }

    function getStatusBadge(status) {
        switch ((status || '').toUpperCase()) {
            case 'CONFIRMED':
            case 'APPROVED':
            case 'PAID':
            case 'SUCCESS':
            case 'THÀNH CÔNG':
                return `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-green-100 text-green-700"><i class="fa-solid fa-circle-check mr-1"></i> Đã xác nhận</span>`;
            case 'PENDING':
            case 'CHỜ DUYỆT':
                return `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-clock mr-1"></i> Chờ duyệt</span>`;
            case 'CANCELLED':
            case 'ĐÃ HỦY':
                return `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-100 text-rose-700"><i class="fa-solid fa-circle-xmark mr-1"></i> Đã hủy</span>`;
            default:
                return `<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-100 text-amber-700"><i class="fa-solid fa-clock mr-1"></i> Chờ duyệt</span>`;
        }
    }

    function getCancellationRequestBadge(request, error) {
        if (error) {
            return `<span class="inline-flex mt-1 text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 text-gray-600"><i class="fa-solid fa-circle-exclamation mr-1"></i>${escapeHtml(error)}</span>`;
        }
        if (!request) return "";

        const labels = {
            PENDING: ["Yêu cầu hủy: Chờ Admin duyệt", "bg-amber-100 text-amber-800", "fa-clock"],
            APPROVED: ["Yêu cầu hủy: Đã duyệt · Đơn đã hủy", "bg-rose-100 text-rose-700", "fa-circle-check"],
            REJECTED: ["Yêu cầu hủy: Bị từ chối", "bg-gray-100 text-gray-700", "fa-circle-xmark"]
        };
        const [label, color, icon] = labels[request.status] || [`Yêu cầu hủy: ${request.status || "Không rõ"}`, "bg-gray-100 text-gray-700", "fa-circle-question"];
        return `<span class="inline-flex mt-1 text-xs font-semibold px-2.5 py-1 rounded-full ${color}"><i class="fa-solid ${icon} mr-1"></i>${escapeHtml(label)}</span>`;
    }

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
        })[character]);
    }

    function formatCurrency(amount) {
        if (!amount) return '0 VNĐ';
        if (typeof amount === 'string' && (amount.includes('đ') || amount.includes('VNĐ'))) return amount;
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    function toggleUserDropdown(e) {
        e.stopPropagation();
        const menu = document.getElementById("user-dropdown-menu");
        menu.classList.toggle("hidden");
    }

    document.addEventListener("click", function (e) {
        const wrapper = document.getElementById("user-menu-wrapper");
        const menu = document.getElementById("user-dropdown-menu");
        if (wrapper && !wrapper.contains(e.target)) {
            menu.classList.add("hidden");
        }
    });

    function goHome() {
        window.location.href = "index.html";
    }

    function handleLogout() {
        if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
            localStorage.clear();
            window.location.href = "login.html";
        }
    }
</script>
</body>
</html>
