<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Smart Stadium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-emerald-600">Smart Stadium</h1>
        <p class="text-xs text-gray-500 mt-1">Đăng nhập vào hệ thống đặt sân thể thao</p>
    </div>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Email hoặc Tên đăng nhập</label>
            <input type="text" id="email" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="Nhập email của bạn...">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu</label>
            <input type="password" id="password" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500" placeholder="••••••••">
        </div>

        <div id="error-message" class="text-red-500 text-xs text-center hidden"></div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm py-2.5 rounded-lg transition shadow-sm">
            Đăng nhập
        </button>
    </form>

    <p class="text-center text-xs text-gray-600 mt-6">
        Chưa có tài khoản? <a href="DangKy.html" class="text-emerald-600 font-semibold hover:underline">Đăng ký ngay</a>
    </p>
    <div class="text-center mt-3">
        <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600"><i class="fa-solid fa-arrow-left mr-1"></i> Quay lại trang chủ</a>
    </div>
</div>

<script>
    const LOGIN_API = "http://localhost:8085/api/auth/login";
    const USER_PROFILE_API = "http://localhost:8085/api/users/by-email";

    document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const emailInput = document.getElementById("email").value.trim();
        const passwordInput = document.getElementById("password").value;
        const errorDiv = document.getElementById("error-message");

        errorDiv.classList.add("hidden");

        try {
            const response = await fetch(LOGIN_API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput, password: passwordInput })
            });

            if (response.ok) {
                const data = await response.json();
                console.log("🔑 Kết quả Đăng nhập từ Backend:", data);

                const userToken = data.token || data.accessToken || "";
                const userEmail = data.email || emailInput;

                // 1. Lưu Token và Email trước
                if (userToken) localStorage.setItem("token", userToken);
                localStorage.setItem("userEmail", userEmail);

                // 2. Tìm kiếm và trích xuất UserId từ các trường có thể xảy ra
                let extractedUserId = data.userId || data.id || (data.user ? (data.user.id || data.user.userId) : null);

                // Nếu đăng nhập bằng JWT Token, thử giải mã Token để lấy Id
                if (!extractedUserId && userToken && userToken.includes('.')) {
                    try {
                        const base64Url = userToken.split('.')[1];
                        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                        const payload = JSON.parse(window.atob(base64));
                        extractedUserId = payload.userId || payload.id || payload.sub;
                    } catch (e) {
                        console.warn("Không thể giải mã Token:", e);
                    }
                }

                // Nếu vẫn chưa tìm thấy, gọi API lấy User Info theo Email
                if (!extractedUserId) {
                    try {
                        console.log("🔍 Đang truy vấn UserId qua email:", userEmail);
                        const userRes = await fetch(`${USER_PROFILE_API}?email=${encodeURIComponent(userEmail)}`, {
                            headers: { "Authorization": userToken ? `Bearer ${userToken}` : "" }
                        });
                        if (userRes.ok) {
                            const userData = await userRes.json();
                            extractedUserId = userData.id || userData.userId;
                        }
                    } catch (e) {
                        console.warn("Lỗi khi truy vấn thông tin User qua email:", e);
                    }
                }

                // 3. Ghi đè bắt buộc UserId vào localStorage
                if (extractedUserId) {
                    console.log("✅ Đã xác định UserId thành công:", extractedUserId);
                    localStorage.setItem("userId", extractedUserId.toString());
                } else {
                    console.warn("⚠️ Không tìm thấy UserId từ Backend.");
                }

                // 4. Phân quyền và lưu Role
                const userRole = data.role || data.userRole || (data.user ? data.user.role : "");
                localStorage.setItem("userRole", userRole);

                // 5. Chuyển hướng
                if (userRole === "ADMIN" || userRole === "ROLE_ADMIN") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "userBooking.html"; // Chuyển thẳng về trang lịch sử để kiểm tra
                }
            } else {
                errorDiv.textContent = "Đăng nhập thất bại. Vui lòng kiểm tra lại email hoặc mật khẩu.";
                errorDiv.classList.remove("hidden");
            }
        } catch (err) {
            console.error("Lỗi kết nối Server:", err);
            errorDiv.textContent = "Không thể kết nối đến máy chủ cổng 8085!";
            errorDiv.classList.remove("hidden");
        }
    });
</script>

</body>
</html>
