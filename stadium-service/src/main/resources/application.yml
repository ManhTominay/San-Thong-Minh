server:
  port: 8081

spring:
  application:
    name: stadium-service # Tên này phải khớp với lb://stadium-service bên api-gateway
  datasource:
    url: jdbc:mysql://localhost:3306/smart_stadium?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/