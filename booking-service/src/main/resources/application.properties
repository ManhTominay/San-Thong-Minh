spring.application.name=booking-service
server.port=8085

# Kết nối CSDL MySQL smart_stadium
spring.datasource.url=jdbc:mysql://localhost:3306/smart_stadium?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=16082005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Đăng ký booking-service vào Eureka để API Gateway định tuyến lb://booking-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/